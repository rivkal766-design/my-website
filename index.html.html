<head>

  <title>ReLink Automations</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #faf9f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #faf9f5; z-index: 9999; }
    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }
    #__bundler_placeholder { color: #999; font-size: 14px; }
  </style>
  <noscript>
    <style>#__bundler_loading { display: none; }</style>
    <div style="position:fixed;bottom:12px;left:12px;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;color:#999;background:rgba(255,255,255,0.9);padding:6px 12px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.08);z-index:10000;">
      This page requires JavaScript to display.
    </div>
  </noscript>
</head>
<body>
  <div id="__bundler_placeholder">Loading ReLink Automations...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ion: column; align-items: center\"><div style=\"width: 40px; height: 40px; border-radius: 12px; background: #0B1630; color: #FFCF5C; display: flex; align-items: center; justify-content: center\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg><\u002Fdiv><\u002Fdiv>\n<div style=\"padding-top: 2px\"><div style=\"font-weight: 500\">הנתונים מוכנים לחיוב הלקוח<\u002Fdiv><div style=\"font-size: 14px; color: #556070\">בלי לאסוף ובלי להקליד<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- PROBLEMS -->\n<section id=\"problems\" style=\"padding: clamp(64px, 8vw, 104px) 0\">\n<div style=\"max-width: 1180px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 32px)\">\n<div style=\"max-width: 680px; margin-bottom: 44px\">\n<div style=\"font-size: 14px; font-weight: 700; color: #8F5A06; margin-bottom: 10px\">מכירה את זה מבפנים<\u002Fdiv>\n<h2 style=\"font-family: 'Frank Ruhl Libre', serif; font-weight: 700; font-size: clamp(32px, 3.8vw, 46px); line-height: 1.15; margin: 0 0 16px\">איפה הזמן של המשרד באמת הולך?<\u002Fh2>\n<p style=\"font-size: 18px; color: #3F4856; margin: 0\">רוב העומס במשרד לא נובע מחוסר בידע מקצועי, אלא מפעולות קטנות שחוזרות על עצמן כל יום.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px\">\n<div style=\"background: #FFFFFF; border: 1px solid #E6E1D6; border-radius: 20px; padding: 30px 26px\">\n<div style=\"width: 48px; height: 48px; border-radius: 14px; background: #FFF4DE; color: #B87508; display: flex; align-items: center; justify-content: center; margin-bottom: 20px\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z\"><\u002Fpath><path d=\"M14 3v5h5\"><\u002Fpath><path d=\"M9 13h6\"><\u002Fpath><path d=\"M9 17h4\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<h3 style=\"font-size: 20px; font-weight: 700; margin: 0 0 10px\">חומר שמגיע מכל כיוון<\u002Fh3>\n<p style=\"margin: 0; color: #3F4856\">חשבוניות וקבלות מגיעות בוואטסאפ, במייל ובצילומי מסך, וצריך לאסוף ולמיין אותן ידנית.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #FFFFFF; border: 1px solid #E6E1D6; border-radius: 20px; padding: 30px 26px\">\n<div style=\"width: 48px; height: 48px; border-radius: 14px; background: #FFF4DE; color: #B87508; display: flex; align-items: center; justify-content: center; margin-bottom: 20px\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"2\" y=\"6\" width=\"20\" height=\"12\" rx=\"2\"><\u002Frect><path d=\"M6 10h.01M10 10h.01M14 10h.01M18 10h.01M8 14h8\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<h3 style=\"font-size: 20px; font-weight: 700; margin: 0 0 10px\">הקלדה חוזרת<\u002Fh3>\n<p style=\"margin: 0; color: #3F4856\">אותם נתונים מוקלדים שוב ושוב, לאקסל, למערכת ולדוח, עם סיכון לטעות בכל העתקה.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #FFFFFF; border: 1px solid #E6E1D6; border-radius: 20px; padding: 30px 26px\">\n<div style=\"width: 48px; height: 48px; border-radius: 14px; background: #FFF4DE; color: #B87508; display: flex; align-items: center; justify-content: center; margin-bottom: 20px\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"9\" cy=\"8\" r=\"3.5\"><\u002Fcircle><path d=\"M2.5 20a6.5 6.5 0 0 1 13 0\"><\u002Fpath><path d=\"M17 11h5M19.5 8.5v5\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<h3 style=\"font-size: 20px; font-weight: 700; margin: 0 0 10px\">משימות ושעות בלי סדר<\u002Fh3>\n<p style=\"margin: 0; color: #3F4856\">לא ברור מי מטפל במה, כמה זמן הושקע בכל לקוח, ואיפה כל תיק עומד.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #FFFFFF; border: 1px solid #E6E1D6; border-radius: 20px; padding: 30px 26px\">\n<div style=\"width: 48px; height: 48px; border-radius: 14px; background: #FFF4DE; color: #B87508; display: flex; align-items: center; justify-content: center; margin-bottom: 20px\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9\"><\u002Fpath><path d=\"M10.3 21a1.94 1.94 0 0 0 3.4 0\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<h3 style=\"font-size: 20px; font-weight: 700; margin: 0 0 10px\">רדיפה אחרי לקוחות<\u002Fh3>\n<p style=\"margin: 0; color: #3F4856\">תזכורות על חומר חסר נשלחות אחת־אחת, ושוב ושוב, עד שהחומר סוף־סוף מגיע.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- SERVICES -->\n<section id=\"services\" style=\"padding: clamp(64px, 8vw, 104px) 0; background: #FFFFFF; border-top: 1px solid #E6E1D6; border-bottom: 1px solid #E6E1D6\">\n<div style=\"max-width: 1180px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 32px)\">\n<div style=\"max-width: 680px; margin-bottom: 44px\">\n<div style=\"font-size: 14px; font-weight: 700; color: #8F5A06; margin-bottom: 10px\">מה אני בונה<\u002Fdiv>\n<h2 style=\"font-family: 'Frank Ruhl Libre', serif; font-weight: 700; font-size: clamp(32px, 3.8vw, 46px); line-height: 1.15; margin: 0 0 16px\">מערכת שנבנית סביב המשרד שלכם<\u002Fh2>\n<p style=\"font-size: 18px; color: #3F4856; margin: 0\">כל מערכת נבנית בהתאמה אישית, לפי הדרך שבה המשרד עובד ועל גבי הכלים שאתם כבר מכירים.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"background: #0B1630; color: #FAF8F4; border-radius: 28px; padding: clamp(24px, 4vw, 48px); display: flex; flex-wrap: wrap; gap: 36px 56px; align-items: center; margin-bottom: 28px\">\n<div style=\"flex: 1 1 380px; min-width: 0\">\n<div style=\"display: inline-block; font-size: 13px; font-weight: 500; color: #0B1630; background: #FFCF5C; padding: 4px 12px; border-radius: 999px; margin-bottom: 16px\">דוגמה למה שאפשר לבנות<\u002Fdiv>\n<h3 style=\"font-family: 'Frank Ruhl Libre', serif; font-size: clamp(26px, 2.8vw, 34px); font-weight: 700; line-height: 1.2; margin: 0 0 14px\">מערכת ניהול משרד אחת, במקום חמישה כלים שלא מדברים ביניהם<\u002Fh3>\n<p style=\"margin: 0; color: #C9D0DB; font-size: 17px\">לקוחות, משימות, עובדים ושעות עבודה, במקום אחד. כל משרד מקבל את המערכת בהתאמה לצרכים שלו.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex: 1 1 380px; min-width: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px\">\n<div style=\"background: #14223F; border: 1px solid #26365A; border-radius: 16px; padding: 18px\"><div style=\"color: #FFCF5C; margin-bottom: 8px\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"9\" cy=\"8\" r=\"3.5\"><\u002Fcircle><path d=\"M2.5 20a6.5 6.5 0 0 1 13 0\"><\u002Fpath><path d=\"M16 4.5a3.5 3.5 0 0 1 0 7\"><\u002Fpath><path d=\"M18 14a6.5 6.5 0 0 1 3.5 6\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div style=\"font-weight: 700\">ניהול לקוחות<\u002Fdiv><div style=\"font-size: 14px; color: #AEB7C6\">כרטיס לקוח, מסמכים וסטטוס<\u002Fdiv><\u002Fdiv>\n<div style=\"background: #14223F; border: 1px solid #26365A; border-radius: 16px; padding: 18px\"><div style=\"color: #FFCF5C; margin-bottom: 8px\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 11l3 3 8-8\"><\u002Fpath><path d=\"M20 12v6a2 2 0 0 1-2 2H6a2 2 <p style=\"margin: 0; color: #3F4856\">חשבוניות וקבלות שנשלחות בוואטסאפ או במייל נשמרות אוטומטית בתיק הלקוח הנכון.<\u002Fp>\n<\u002Farticle>\n<article style=\"background: #FAF8F4; border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 12px\">\n<div style=\"font-family: 'Frank Ruhl Libre', serif; font-size: 15px; color: #3550D0; font-weight: 700\">02<\u002Fdiv>\n<h3 style=\"font-size: 20px; font-weight: 700; margin: 0\">תזכורות ללקוחות<\u002Fh3>\n<p style=\"margin: 0; color: #3F4856\">בסוף החודש כל לקוח מקבל הודעה עם רשימת החומר שעדיין חסר, רק אם באמת חסר.<\u002Fp>\n<\u002Farticle>\n<article style=\"background: #FAF8F4; border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 12px\">\n<div style=\"font-family: 'Frank Ruhl Libre', serif; font-size: 15px; color: #3550D0; font-weight: 700\">03<\u002Fdiv>\n<h3 style=\"font-size: 20px; font-weight: 700; margin: 0\">חיבור בין מערכות<\u002Fh3>\n<p style=\"margin: 0; color: #3F4856\">נתונים עוברים בין הטפסים, הגיליונות והמערכות שלכם, בלי העתק־הדבק.<\u002Fp>\n<\u002Farticle>\n<article style=\"background: #FAF8F4; border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 12px\">\n<div style=\"font-family: 'Frank Ruhl Libre', serif; font-size: 15px; color: #3550D0; font-weight: 700\">04<\u002Fdiv>\n<h3 style=\"font-size: 20px; font-weight: 700; margin: 0\">מועדים והתראות<\u002Fh3>\n<p style=\"margin: 0; color: #3F4856\">כל אחד בצוות יודע מה צריך להגיש השבוע, ושום דיווח לא נופל בין הכיסאות.<\u002Fp>\n<\u002Farticle>\n<article style=\"background: #FAF8F4; border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 12px\">\n<div style=\"font-family: 'Frank Ruhl Libre', serif; font-size: 15px; color: #3550D0; font-weight: 700\">05<\u002Fdiv>\n<h3 style=\"font-size: 20px; font-weight: 700; margin: 0\">קליטת לקוח חדש<\u002Fh3>\n<p style=\"margin: 0; color: #3F4856\">טופס דיגיטלי שהלקוח ממלא מהטלפון, והפרטים נכנסים ישר למערכת.<\u002Fp>\n<\u002Farticle>\n<article style=\"background: #FAF8F4; border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 12px\">\n<div style=\"font-family: 'Frank Ruhl Libre', serif; font-size: 15px; color: #3550D0; font-weight: 700\">06<\u002Fdiv>\n<h3 style=\"font-size: 20px; font-weight: 700; margin: 0\">דוחות ותמונת מצב<\u002Fh3>\n<p style=\"margin: 0; color: #3F4856\">סטטוס תיקים, חומר חסר ועומס בצוות, מוכנים בלי שמישהו יצטרך להכין אותם.<\u002Fp>\n<\u002Farticle>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- PROJECTS -->\n<section id=\"projects\" style=\"padding: clamp(64px, 8vw, 104px) 0\">\n<div style=\"max-width: 1180px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 32px)\">\n<div style=\"max-width: 680px; margin-bottom: 44px\">\n<div style=\"font-size: 14px; font-weight: 700; color: #8F5A06; margin-bottom: 10px\">פרויקטים שבניתי<\u002Fdiv>\n<h2 style=\"font-family: 'Frank Ruhl Libre', serif; font-weight: 700; font-size: clamp(32px, 3.8vw, 46px); line-height: 1.15; margin: 0 0 16px\">מערכות שכבר עובדות בשטח<\u002Fh2>\n<p style=\"font-size: 18px; color: #3F4856; margin: 0\">כל מערכת נבנתה מאפס לפי הצרכים של הארגון, ומשמשת אותו בעבודה היומיומית.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px\">\n<article style=\"background: #FFFFFF; border: 1px solid #E6E1D6; border-radius: 20px; padding: 30px; display: flex; flex-direction: column; gap: 14px\">\n<div style=\"display: flex; justify-content: space-between; align-items: center; gap: 12px\">\n<div style=\"width: 52px; height: 52px; border-radius: 14px; background: #E9EEFC; color: #3550D0; display: flex; align-items: center; justify-content: center\"><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"2\" y=\"5\" width=\"20\" height=\"14\" rx=\"2\"><\u002Frect><path d=\"M2 10h20\"><\u002Fpath><path d=\"M6 15h4\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<span style=\"font-size: 13px; color: #556070; background: #F3F1EC; padding: 4px 12px; border-radius: 999px\">מוסד לימוד<\u002Fspan>\n<\u002Fdiv>\n<h3 style=\"font-size: 21px; font-weight: 700; margin: 0\">מערכת שכר לימוד<\u002Fh3>\n<p style=\"margin: 0; color: #3F4856\">ניהול תשלומי שכר הלימוד ומעקב אחר יתרות, בתמונה אחת מסודרת.<\u002Fp>\n<\u002Farticle>\n<article style=\"background: #FFFFFF; border: 1px solid #E6E1D6; border-radius: 20px; padding: 30px; display: flex; flex-direction: column; gap: 14px\">\n<div style=\"display: flex; justify-content: space-between; align-items: center; gap: 12px\">\n<div style=\"width: 52px; height: 52px; border-radius: 14px; background: #E9EEFC; color: #3550D0; display: flex; align-items: center; justify-content: center\"><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2\"><\u002Fpath><rect x=\"8\" y=\"2\" width=\"8\" height=\"4\" rx=\"1\"><\u002Frect><path d=\"m9 14 2 2 4-4\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<span style=\"font-size: 13px; color: #556070; background: #F3F1EC; padding: 4px 12px; border-radius: 999px\">ישיבה<\u002Fspan>\n<\u002Fdiv>\n<h3 style=\"font-size: 21px; font-weight: 700; margin: 0\">מערכת רישום לישיבה<\u002Fh3>\n<p style=\"margin: 0; color: #3F4856\">תהליך רישום דיגיטלי ומסודר לתלמידים חדשים, מהטופס ועד הקליטה.<\u002Fp>\n<\u002Farticle>\n<article style=\"background: #FFFFFF; border: 1px solid #E6E1D6; border-radius: 20px; padding: 30px; display: flex; flex-direction: column; gap: 14px\">\n<div style=\"display: flex; justify-content: space-between; align-items: center; gap: 12px\">\n<div style=\"width: 52px; height: 52px; border-radius: 14px; background: #E9EEFC; color: #3550D0; display: flex; align-items: center; justify-content: center\"><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M21 8 12 3 3 8v8l9 5 9-5z\"><\u002Fpath><path d=\"m3 8 9 5 9-5\"><\u002Fpath><path d=\"M12 13v8\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<span style=\"font-size: 13px; color: #556070; background: #F3F1EC; padding: 4px 12px; border-radius: 999px\">קמעונאות<\u002Fspan>\n<\u002Fdiv>\n<h3 style=\"font-size: 21px; font-weight: 700; margin: 0\">ניהול מלאי מחסן לרשת בגדים<\u002Fh3>\n<p style=\"margin: 0; color: #3F4856\">מעקב אחר המלאי במחסן, כניסות ויציאות, וחלוקה לסניפי הרשת.<\u002Fp>\n<\u002Farticle>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- ABOUT -->\n<section id=\"about\" style=\"padding: clamp(64px, 8vw, 104px) 0; background: #FFFFFF; border-top: 1px solid #E6E1D6; border-bottom: 1px solid #E6E1D6\">\n<div style=\"max-width: 1180px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 32px); display: flex; flex-wrap: wrap; gap: 48px; align-items: center\">\n<div style=\"flex: 0 1 340px; min-width: 0; margin: 0 auto\">\n<div style=\"background: #FAF8F4; border: 1px solid #E6E1D6; border-radius: 28px; padding: 48px 36px; display: flex; flex-direction: column; align-items: center; gap: 20px; text-align: center\">\n<img src=\"3a5427f0-20e0-4db0-83fb-d096c4949ac5\" alt=\"\" style=\"width: 120px; height: 118px; display: block\">\n<div>\n<div style=\"font-family: 'Frank Ruhl Libre', serif; font-size: 28px; font-weight: 700\">רבקה לרפילד<\u002Fdiv>\n<div style=\"color: #556070\">מערכות ואוטומציות לעסקים<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 1 1 480px; min-width: 0\">\n<div style=\"font-size: 14px; font-weight: 700; color: #8F5A06; margin-bottom: 10px\">קצת עליי<\u002Fdiv>\n<h2 style=\"font-family: 'Frank Ruhl Libre', serif; font-weight: 700; font-size: clamp(32px, 3.8vw, 46px); line-height: 1.15; margin: 0 0 20px\">מכירה את העבודה במשרד מהצד שלכם<\u002Fh2>\n<p style=\"font-size: 18px; color: #3F4856; margin: 0 0 16px\">עבדתי כמנהלת חשבונות ונחשפתי מקרוב לעבודה השוטפת בתחום המיסים וראיית החשבון. אני מכירה מבפנים את הלחץ של סוף החודש, את הרדיפה אחרי חומר ואת הדיווחים שלא מחכים.<\u002Fp>\n<p style=\"font-size: 18px; color: #3F4856; margin: 0 0 28px\">היום אני משלבת את הידע הזה עם בניית מערכות ואוטומציות. כשמי שבונה את המערכת מבינה את העבודה המקצועית, לא צריך להסביר הכול מההתחלה.<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; gap: 10px\">\n<span style=\"font-size: 14px; font-weight: 500; background: #FFF4DE; color: #6E4504; padding: 8px 14px; border-radius: 999px\">רקע בהנהלת חשבונות, מיסים וראיית חשבון<\u002Fspan>\n<span dir=\"ltr\" style=\"font-size: 14px; font-weight: 500; background: #E9EEFC; color: #22379E; padding: 8px 14px; border-radius: 999px\">Google Sheets<\u002Fspan>\n<span dir=\"ltr\" style=\"font-size: 14px; font-weight: 500; background: #E9EEFC; color: #22379E; padding: 8px 14px; border-radius: 999px\">Make<\u002Fspan>\n<span dir=\"ltr\" style=\"font-size: 14px; font-weight: 500; background: #E9EEFC; color: #22379E; padding: 8px 14px; border-radius: 999px\">Airtable<\u002Fspan>\n<span dir=\"ltr\" style=\"font-size: 14px; font-weight: 500; background: #E9EEFC; color: #22379E; padding: 8px 14px; border-radius: 999px\">Origami<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- PROCESS -->\n<section id=\"process\" style=\"padding: clamp(64px, 8vw, 104px) 0\">\n<div style=\"max-width: 1180px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 32px)\">\n<div style=\"max-width: 640px; margin-bottom: 52px\">\n<div style=\"font-size: 14px; font-weight: 700; color: #8F5A06; margin-bottom: 10px\">איך זה עובד<\u002Fdiv>\n<h2 style=\"font-family: 'Frank Ruhl Libre', serif; font-weight: 700; font-size: clamp(32px, 3.8vw, 46px); line-height: 1.15; margin: 0\">ארבעה שלבים, מהשיחה הראשונה ועד מערכת שעובדת<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 32px\">\n<div style=\"border-top: 2px solid #0B1630; padding-top: 22px\">\n<div style=\"font-family: 'Frank Ruhl Libre', serif; font-size: 44px; line-height: 1; color: #DB8A0F; font-weight: 500; margin-bottom: 16px\">01<\u002Fdiv>\n<h3 style=\"font-size: 20px; font-weight: 700; margin: 0 0 8px\">היכרות קצרה<\u002Fh3>\n<p style=\"margin: 0; color: #3F4856\">שיחה ללא התחייבות, להבין איך המשרד עובד ומה הכי מעיק עליכם.<\u002Fp>\n<\u002Fdiv>\n<div style=\"border-top: 2px solid #0B1630; padding-top: 22px\">\n<div style=\"font-family: 'Frank Ruhl Libre', serif; font-size: 44px; line-height: 1; color: #DB8A0F; font-weight: 500; margin-bottom: 16px\">02<\u002Fdiv>\n<h3 style=\"font-size: 20px; font-weight: 700; margin: 0 0 8px\">אפיון<\u002Fh3>\n<p style=\"margin: 0; color: #3F4856\">נמפה יחד את התהליכים ונגדיר בדיוק מה המערכת צריכה לעשות, ומה קודם.<\u002Fp>\n<\u002Fdiv>\n<div style=\"border-top: 2px solid #0B1630; padding-top: 22px\">\n<div style=\"font-family: 'Frank Ruhl Libre', serif; font-size: 44px; line-height: 1; color: #DB8A0F; font-weight: 500; margin-bottom: 16px\">03<\u002Fdiv>\n<h3 style=\"font-size: 20px; font-weight: 700; margin: 0 0 8px\">בנייה<\u002Fh3>\n<p style=\"margin: 0; color: #3F4856\">אבנה את המערכת והאוטומציות, אבדוק אותן לעומק ואדריך את הצוות.<\u002Fp>\n<\u002Fdiv>\n<div style=\"border-top: 2px solid #0B1630; padding-top: 22px\">\n<div style=\"font-family: 'Frank Ruhl Libre', serif; font-size: 44px; line-height: 1; color: #DB8A0F; font-weight: 500; margin-bottom: 16px\">04<\u002Fdiv>\n<h3 style=\"font-size: 20px; font-weight: 700; margin: 0 0 8px\">ליווי ושיפור<\u002Fh3>\n<p style=\"margin: 0; color: #3F4856\">אמשיך ללוות, לתקן ולשפר, כדי שהמערכת תגדל יחד עם המשרד.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- TESTIMONIALS -->\n<section id=\"testimonials\" style=\"padding: clamp(64px, 8vw, 104px) 0; background: #0B1630; color: #FAF8F4\">\n<div style=\"max-width: 1180px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 32px)\">\n<div style=\"max-width: 640px; margin-bottom: 44px\">\n<div style=\"font-size: 14px; font-weight: 700; color: #FFCF5C; margin-bottom: 10px\">המלצות<\u002Fdiv>\n<h2 style=\"font-family: 'Frank Ruhl Libre', serif; font-weight: 700; font-size: clamp(32px, 3.8vw, 46px); line-height: 1.15; margin: 0\">מה אומרים הלקוחות<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 20px\">\n<sc-for list=\"{{testimonials}}\" as=\"t\" hint-placeholder-count=\"1\">\n<figure style=\"margin: 0; flex: 1 1 340px; max-width: 860px; background: #14223F; border: 1px solid #26365A; border-radius: 24px; padding: clamp(26px, 4vw, 44px); display: flex; flex-direction: column; gap: 22px\">\n<div style=\"font-family: 'Frank Ruhl Libre', serif; font-size: 64px; line-height: 0.6; color: #FFCF5C\" aria-hidden=\"true\">״<\u002Fdiv>\n<blockquote style=\"margin: 0; font-size: clamp(17px, 1.6vw, 20px); line-height: 1.75; white-space: pre-line\">{{t.quote}}<\u002Fblockquote>\n<figcaption style=\"display: flex; align-items: center; gap: 14px; padding-top: 20px; border-top: 1px solid #26365A\">\n<div style=\"width: 46px; height: 46px; border-radius: 50%; background: #26365A; color: #FFCF5C; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px\">{{t.initial}}<\u002Fdiv>\n<div><div style=\"font-weight: 700\">{{t.name}}<\u002Fdiv><div style=\"font-size: 14px; color: #AEB7C6\">{{t.role}}<\u002Fdiv><\u002Fdiv>\n<\u002Ffigcaption>\n<\u002Ffigure>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- QUESTIONNAIRE -->\n<section id=\"check\" style=\"padding: clamp(64px, 8vw, 112px) 0\">\n<div style=\"max-width: 940px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 32px)\">\n<div style=\"text-align: center; max-width: 680px; margin: 0 auto 40px\">\n<div style=\"font-size: 14px; font-weight: 700; color: #8F5A06; margin-bottom: 10px\">שאלון בדיקת התאמה<\u002Fdiv>\n<h2 style=\"font-fam systems that don’t talk to each other'], ['אין, התהליכים שלנו כבר יעילים לגמרי', 'None, our processes are already fully streamlined'], ['אחר', 'Other']] },\n        { id: 'a7', t: 'single', q: ['אם הייתם יכולים להפוך תהליך אחד לאוטומטי כבר מחר, מה הוא היה?', 'If you could automate one process tomorrow, what would it be?'], o: [['קליטה אוטומטית של חשבוניות', 'Automatic invoice capture'], ['תזכורות אוטומטיות ללקוחות לשליחת חומר בסוף החודש', 'Automatic month-end reminders to clients to send materials'], ['ניהול ושיבוץ משימות בצוות המשרד', 'Managing and assigning tasks within the team'], ['גבייה וחיוב לקוחות אוטומטיים', 'Automatic client billing and collection'], ['אחר', 'Other']] },\n        hours,\n        start,\n        { id: 'a10', t: 'text', q: ['יש נושאים נוספים שתרצו לפרט, או שאלות שתרצו להעלות?', 'Is there anything else you would like to share or ask?'] }\n      ],\n      edu: [\n        { t: 'sec', q: ['מערכות וכלים', 'Systems and tools'] },\n        { id: 'e1', t: 'multi', q: ['באילו מערכות אתם משתמשים כיום לניהול השוטף?', 'Which systems do you currently use for daily management?'], o: [['תוכנה לניהול שכר לימוד', 'Tuition management software'], ['מערכת נוכחות תלמידים', 'Student attendance system'], ['מערכת סליקת אשראי', 'Credit card processing'], ['תוכנת הנהלת חשבונות', 'Accounting software'], ['ניהול משימות', 'Task management'], ['ניהול צוות', 'Staff management']] },\n        { id: 'e2', t: 'text', q: ['מה שמות התוכנות שבהן אתם משתמשים?', 'Please name the programs you use'] },\n        { t: 'sec', q: ['תהליכי עבודה', 'Workflows'] },\n        { id: 'e3', t: 'single', q: ['איזו משימה או תהליך גוזלים כיום הכי הרבה זמן לצוות המשרד?', 'Which task or process currently takes the most time for your office team?'], o: [['רישום: קליטה וטיפול בבקשות של תלמידים חדשים', 'Registration: managing and processing new student applications'], ['שכר לימוד ותשלומים: מעקב אחר תשלומים וחובות', 'Tuition and payments: chasing payments and tracking debt'], ['נוכחות: מעקב ידני אחר נוכחות תלמידים או צוות', 'Attendance: manually tracking student or staff attendance'], ['ניירת: הדפסה ותיוק פיזי של מסמכים', 'Paperwork: printing and physically filing documents'], ['שמירת מסמכים: סידור וחיפוש של קבצים דיגיטליים ופיזיים', 'Document storage: organizing and searching digital and physical files'], ['אחר', 'Other']] },\n        { id: 'e4', t: 'single', q: ['באיזה תחום מתבצעת הכי הרבה הזנת נתונים ידנית?', 'In which area do you do the most manual data entry?'], o: [['העברת נתונים בין מערכות, למשל מטופס הרישום למערכת שכר הלימוד', 'Moving data between systems, e.g. from the registration form to the tuition system'], ['עדכון מערכת שעות והחלפות, כולל היעדרויות מורים', 'Updating timetables and substitutions, including teacher absences'], ['רישום ציונים ותוצאות מבחנים לגיליון', 'Typing grades and test results into a spreadsheet'], ['דיווח לרשויות: הכנת נתונים לדוחות או לבקשות מימון', 'Reporting to authorities: preparing data for reports or funding requests'], ['מעקב הוצאות: הזנת קבלות וחשבוניות להנהלת החשבונות', 'Expense tracking: entering receipts and invoices for bookkeeping'], ['אחר', 'Other']] },\n        hours,\n        start,\n        { id: 'e7', t: 'text', q: ['אם הייתם יכולים להפוך תהליך אחד שחוזר על עצמו לאוטומטי כבר מחר, מה הוא היה?', 'If you could automate one repetitive process tomorrow, what would it be?'] }\n      ]\n    };\n  }\n\n  getUi(lang) {\n    if (lang === 'en') {\n      return {\n        typeLabel: 'Organization type', tabAcc: 'Accounting / tax office', tabEdu: 'Educational institution',\n        contactTitle: 'Contact details', requiredNote: '* Required fields',\n        fName: 'Full name', fOrgAcc: 'Office name', fOrgEdu: 'Institution name', fPhone: 'Phone', fEmail: 'Email',\n        multi: '(select all that apply)', submit: 'Send questionnaire',\n        closing: 'Clicking the button sends me your answers. I will review them and get back to you with ideas for streamlining your work.',\n        error: 'Please fill in your full name, organization and phone so I can get back to you.',\n        thanks: 'Thank you', thanksText: 'Your questionnaire has been received. I will review your answers and get back to you soon for a no-obligation introductory call.',\n        again: 'Fill in another questionnaire', close: 'Close questionnaire'\n      };\n    }\n    return {\n      typeLabel: 'סוג הארגון', tabAcc: 'משרד הנהלת חשבונות / יועצי מס', tabEdu: 'מוסד לימוד',\n      contactTitle: 'פרטי קשר', requiredNote: '* שדות חובה',\n      fName: 'שם מלא', fOrgAcc: 'שם המשרד', fOrgEdu: 'שם המוסד', fPhone: 'טלפון', fEmail: 'אימייל',\n      multi: '(אפשר לבחור כמה)', submit: 'שליחת השאלון',\n      closing: 'לחיצה על הכפתור תשלח אליי את הנתונים, ואשמח לבחון עבורכם הצעות להתייעלות על סמך השאלון.',\n      error: 'נא למלא שם מלא, שם הארגון וטלפון, כדי שאוכל לחזור אליכם.',\n      thanks: 'תודה רבה', thanksText: 'השאלון התקבל. אעבור על התשובות ואחזור אליכם בהקדם לשיחת היכרות ללא התחייבות.',\n      again: 'מילוי שאלון נוסף', close: 'סגירת השאלון'\n    };\n  }\n\n  setContact(key, value) {\n    var c = Object.assign({}, this.state.contact);\n    c[key] = value;\n    this.setState({ contact: c, error: false });\n  }\n\n  setAnswer(id, value) {\n    var a = Object.assign({}, this.state.answers);\n    a[id] = value;\n    this.setState({ answers: a });\n  }\n\n  renderVals() {\n    var self = this;\n    var s = this.state;\n    var li = s.lang === 'en' ? 1 : 0;\n    var ui = this.getUi(s.lang);\n    var list = this.getData()[s.quiz];\n    var answers = s.answers;\n    var n = 0;\n\n    var items = list.map(function (it) {\n      if (it.t === 'sec') {\n        return { isSec: true, isChoice: false, isText: false, title: it.q[li], num: '', hint: '', opts: [], value: '', onInput: null };\n      }\n      n += 1;\n      var num = (n < 10 ? '0' : '') + n;\n      if (it.t === 'text') {\n        return {\n          isSec: false, isChoice: false, isText: true, title: it.q[li], num: num, hint: '', opts: [],\n          value: answers[it.id] || '',\n          onInput: function (e) { self.setAnswer(it.id, e.target.value); }\n        };\n      }\n      var multi = it.t === 'multi';\n      var cur = answers[it.id];\n      return {\n        isSec: false, isChoice: true, isText: false, title: it.q[li], num: num,\n        hint: multi ? ui.multi : '', value: '', onInput: null,\n        opts: it.o.map(function (pair, oi) {\n          var sel = multi ? (Array.isArray(cur) && cur.indexOf(oi) !== -1) : cur === oi;\n          return {\n            label: pair[li],\n            selected: sel,\n            offRound: !sel && !multi,\n            offSquare: !sel && multi,\n            pick: function () {\n              if (multi) {\n                var arr = Array.isArray(self.state.answers[it.id]) ? self.state.answers[it.id].slice() : [];\n                var at = arr.indexOf(oi);\n                if (at === -1) arr.push(oi); else arr.splice(at, 1);\n                self.setAnswer(it.id, arr);\n              } else {\n                self.setAnswer(it.id, oi);\n              }\n            }\n          };\n        })\n      };\n    });\n\n    var c = s.contact;\n    return {\n      dir: s.lang === 'he' ? 'rtl' : 'ltr',\n      langAttr: s.lang,\n      ui: ui,\n      items: items,\n      testimonials: this.getTestimonials(),\n      contact: c,\n      orgLabel: s.quiz === 'acc' ? ui.fOrgAcc : ui.fOrgEdu,\n      setName: function (e) { self.setContact('name', e.target.value); },\n      setOrg: function (e) { self.setContact('org', e.target.value); },\n      setPhone: function (e) { self.setContact('phone', e.target.value); },\n      setEmail: function (e) { self.setContact('email', e.target.value); },\n      showError: s.error,\n      sent: s.sent,\n      notSent: !s.sent,\n      thanksTitle: ui.thanks + (c.name.trim() ? (s.lang === 'he' ? ', ' : ', ') + c.name.trim().split(' ')[0] : '') + '!',\n      submit: function () {\n        var cc = self.state.contact;\n        if (!cc.name.trim() || !cc.org.trim() || !cc.phone.trim()) { self.setState({ error: true }); return; }\n        // בגרסה החיה: כאן התשובות יישלחו ל־Make, ומשם לגוגל שיטס ולהתראה במייל\n        self.setState({ sent: true, error: false });\n      },\n      again: function () {\n        self.setState({ sent: false, answers: {}, error: false, contact: { name: '', org: '', phone: '', email: '' } });\n      },\n      accActive: s.quiz === 'acc', accInactive: s.quiz !== 'acc',\n      eduActive: s.quiz === 'edu', eduInactive: s.quiz !== 'edu',\n      heActive: s.lang === 'he', heInactive: s.lang !== 'he',\n      enActive: s.lang === 'en', enInactive: s.lang !== 'en',\n      pickAcc: function () { if (self.state.quiz !== 'acc') self.setState({ quiz: 'acc', answers: {}, error: false }); },\n      pickEdu: function () { if (self.state.quiz !== 'edu') self.setState({ quiz: 'edu', answers: {}, error: false }); },\n      pickHe: function () { self.setState({ lang: 'he' }); },\n      pickEn: function () { self.setState({ lang: 'en' }); },\n      open: s.open,\n      closed: !s.open,\n      openAcc: function () { self.setState({ open: true, quiz: 'acc', answers: self.state.quiz === 'acc' ? self.state.answers : {} }); },\n      openEdu: function () { self.setState({ open: true, quiz: 'edu', answers: self.state.quiz === 'edu' ? self.state.answers : {} }); },\n      openQuiz: function () { self.setState({ open: true }); },\n      closeQuiz: function () { self.setState({ open: false, error: false }); }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
